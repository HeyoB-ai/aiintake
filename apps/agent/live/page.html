<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Praat met de intake</title>
    <style>
      :root {
        color-scheme: dark;
        --rand: #2a3441;
        --zacht: #8b98a8;
      }
      body {
        margin: 0;
        background: #12161c;
        color: #e6edf3;
        font: 15px/1.55 ui-sans-serif, system-ui, sans-serif;
        display: grid;
        grid-template-columns: 1fr 380px;
        height: 100vh;
      }
      main {
        padding: 24px 28px;
        overflow-y: auto;
      }
      aside {
        border-left: 1px solid var(--rand);
        padding: 24px 20px;
        overflow-y: auto;
        background: #0e1218;
      }
      h1 {
        font-size: 17px;
        margin: 0 0 4px;
      }
      p.sub {
        color: var(--zacht);
        margin: 0 0 20px;
        font-size: 13px;
      }
      button {
        font: inherit;
        padding: 10px 18px;
        border-radius: 7px;
        border: 1px solid var(--rand);
        background: #1b2230;
        color: #e6edf3;
        cursor: pointer;
      }
      button.primair {
        background: #2f6f4f;
        border-color: #3c8a63;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #fase {
        display: none;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
        font-size: 12px;
      }
      #fase.aan {
        display: flex;
      }
      .stap {
        padding: 3px 9px;
        border-radius: 999px;
        border: 1px solid var(--rand);
        color: var(--zacht);
      }
      .stap.bezig {
        border-color: #3c8a63;
        color: #9ad3b4;
      }
      .stap.klaar {
        background: #23422f;
        border-color: #3c8a63;
        color: #cdeadb;
      }
      #fasefout {
        color: #e06c5a;
      }
      #build {
        font-size: 11px;
        color: #55606e;
        margin-top: 6px;
      }
      video#avatar {
        display: none;
        width: 100%;
        max-width: 420px;
        border-radius: 10px;
        background: #000;
        margin-bottom: 16px;
      }
      video#avatar.aan {
        display: block;
      }
      #niveau {
        height: 6px;
        background: #1b222c;
        border-radius: 3px;
        overflow: hidden;
        margin: 18px 0 22px;
      }
      #niveau div {
        height: 100%;
        width: 0%;
        background: #3c8a63;
        transition: width 60ms linear;
      }
      .beurt {
        border-top: 1px solid var(--rand);
        padding: 14px 0;
      }
      .rol {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--zacht);
      }
      .client .rol {
        color: #7aa2d6;
      }
      .hud {
        font-family: ui-monospace, monospace;
        font-size: 11.5px;
        color: var(--zacht);
        margin-top: 6px;
      }
      .waarschuwing {
        color: #e0a44a;
      }
      h2 {
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--zacht);
        margin: 0 0 8px;
      }
      .blok {
        margin-bottom: 22px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12.5px;
      }
      td {
        padding: 3px 0;
        vertical-align: top;
      }
      td.k {
        color: var(--zacht);
        padding-right: 10px;
        white-space: nowrap;
      }
      .risico {
        color: #e0a44a;
        font-size: 12.5px;
        padding: 2px 0;
      }
      .risico.kritiek {
        color: #e06c5a;
      }
      #status {
        font-size: 12.5px;
        color: var(--zacht);
        margin-top: 14px;
      }
      /* Avatarminuten zijn de duurste post; hoe lang er betaald wordt hoort in beeld. */
      #teller {
        font-family: ui-monospace, monospace;
        font-size: 12.5px;
        color: var(--zacht);
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Praat met de intake</h1>
      <p class="sub">
        Nederlands, microfoon aan. Onderbreek gerust terwijl hij praat — dat is de test.
      </p>
      <div id="fase">
        <span class="stap" data-stap="sessie">sessie starten</span>
        <span class="stap" data-stap="verbonden">verbonden</span>
        <span class="stap" data-stap="frame">eerste frame</span>
        <span id="fasefout"></span>
      </div>
      <video id="avatar" autoplay playsinline></video>
      <button id="start" class="primair">Start gesprek</button>
      <button id="stop" disabled>Stop</button>
      <div id="niveau"><div></div></div>
      <div id="gesprek"></div>
      <div id="status">niet verbonden</div>
      <div id="teller">sessie 00:00</div>
      <div id="build">pagina van __BUILD__</div>
    </main>

    <aside>
      <div class="blok">
        <h2>Volledigheid</h2>
        <div id="score">—</div>
      </div>
      <div class="blok">
        <h2>Urgentie</h2>
        <div id="risicos">geen signalen</div>
      </div>
      <div class="blok">
        <h2>Vastgelegde feiten</h2>
        <table id="feiten">
          <tbody></tbody>
        </table>
      </div>
      <div class="blok">
        <h2>Geweigerd</h2>
        <div id="geweigerd">geen</div>
      </div>
    </aside>

    <script type="module">
      const SR = 16000;
      const $ = (id) => document.getElementById(id);
      /**
       * De statusregel, en een fout die blijft staan.
       *
       * `status()` wordt vaak overschreven — dat hoort ook. Maar een echte fout mag niet
       * verdwijnen onder de melding van het sluiten dat erop volgt: dan lees je het gevolg
       * en niet de oorzaak.
       */
      let fataleFout = null;
      const status = (t) => {
        if (fataleFout) return;
        $('status').textContent = t;
      };
      const fout = (t) => {
        fataleFout = t;
        $('status').textContent = t;
        $('status').style.color = '#e06c5a';
      };

      let ws = null;
      let ctxIn = null;
      let ctxUit = null;
      let volgendeStart = 0;
      let bronnen = [];

      /**
       * De avatar, als hij aanstaat.
       *
       * Anam draait volledig in de browser: hun SDK zet de WebRTC-verbinding op en er is
       * geen serverkant waar wij audio in kunnen duwen. De PCM die de server stuurt gaat
       * daarom niet naar de speakers maar naar hún invoerstroom, en wat je hoort is wat
       * zij terugsturen — gesynchroniseerd met het gezicht.
       */
      let anam = null;
      let anamInvoer = null;
      // Komt van de server; niet hier herhalen. Anam accepteert 16000, 24000 en 44100, maar
      // wat wij sturen bepaalt de TTS — en die staat op 16 kHz omdat Cartesia over de
      // WebSocket geen hogere rate levert.
      let SR_UIT = 16000;

      function nieuweAnamStroom() {
        if (!anam) return null;
        return anam.createAgentAudioInputStream({
          encoding: 'pcm_s16le',
          sampleRate: SR_UIT,
          channels: 1,
        });
      }

      /**
       * De fasen van het opzetten, zichtbaar.
       *
       * Zonder dit is "ik zie geen gezicht" niet te onderscheiden van "de sessie is nooit
       * gestart", "het token is geweigerd" of "er komt wel een stream maar geen frame".
       * Dat onderscheid kost anders een avond frontend uitpluizen.
       */
      function fase(naam, stand, fout) {
        document.getElementById('fase').classList.add('aan');
        const el = document.querySelector(`.stap[data-stap="${naam}"]`);
        if (el) {
          el.classList.remove('bezig', 'klaar');
          if (stand) el.classList.add(stand);
        }
        document.getElementById('fasefout').textContent = fout ?? '';
      }

      function regel(rol, tekst, hud, klasse = '') {
        const d = document.createElement('div');
        d.className = 'beurt ' + klasse;
        d.innerHTML =
          `<div class="rol">${rol}</div><div>${tekst || '<i>(stilte)</i>'}</div>` +
          (hud ? `<div class="hud">${hud}</div>` : '');
        $('gesprek').prepend(d);
      }

      /** Audio afspelen op volgorde, zodat er geen gaten of overlap ontstaan. */
      function speel(int16) {
        // Met avatar gaat de audio hun kant op; lokaal afspelen zou hem dubbel laten
        // klinken en bovendien vóór het gezicht uit lopen.
        if (anam) {
          anamInvoer ??= nieuweAnamStroom();
          anamInvoer?.sendAudioChunk(
            new Uint8Array(int16.buffer, int16.byteOffset, int16.byteLength),
          );
          return;
        }
        if (!ctxUit) return;
        const buf = ctxUit.createBuffer(1, int16.length, SR);
        const kanaal = buf.getChannelData(0);
        for (let i = 0; i < int16.length; i++) kanaal[i] = int16[i] / 32768;
        const bron = ctxUit.createBufferSource();
        bron.buffer = buf;
        bron.connect(ctxUit.destination);
        const nu = ctxUit.currentTime;
        if (volgendeStart < nu) volgendeStart = nu + 0.05;
        bron.start(volgendeStart);
        volgendeStart += buf.duration;
        bronnen.push(bron);
        bron.onended = () => (bronnen = bronnen.filter((b) => b !== bron));
      }

      /** Barge-in: alles wat nog klaarstaat weggooien, niet uitspelen. */
      function stopGeluid() {
        if (anam) {
          // Hun eigen onderbreekhaak. Zonder dit praat het gezicht door nadat de server
          // allang gestopt is, en dan lijkt barge-in kapot terwijl hij werkt.
          try {
            anam.interruptPersona();
          } catch {}
          try {
            anamInvoer?.endSequence();
          } catch {}
          anamInvoer = null;
          return;
        }
        for (const b of bronnen) {
          try {
            b.stop();
          } catch {}
        }
        bronnen = [];
        volgendeStart = 0;
      }

      async function start() {
        $('start').disabled = true;
        status('microfoon aanvragen…');

        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });

        ctxIn = new AudioContext({ sampleRate: SR });
        ctxUit = new AudioContext({ sampleRate: SR });
        await ctxUit.resume();

        ws = new WebSocket(`ws://${location.host}`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          status('verbonden — de keten wordt opgezet…');
          $('stop').disabled = false;
        };

        ws.onmessage = (e) => {
          if (e.data instanceof ArrayBuffer) {
            speel(new Int16Array(e.data));
            return;
          }
          const m = JSON.parse(e.data);
          if (m.type === 'clear') stopGeluid();
          if (m.type === 'stop') {
            // De server sluit af — inactiviteit, ctrl-c, of iemand die op Stop drukte in
            // een andere tab. De reden meesturen scheelt raden.
            stop('sessie beëindigd: ' + (m.reden ?? 'door de server'));
            return;
          }
          if (m.type === 'ready') {
            if (m.sampleRate) SR_UIT = m.sampleRate;
            // Wat de server werkelijk meestuurde, zodat een controle het kan uitlezen in
            // plaats van het uit de zichtbare gevolgen af te leiden. Het token zelf niet:
            // alleen of het er was.
            window.__ready = { ...m, anamToken: m.anamToken ? '(aanwezig)' : null };
            // De fasebalk hoort er te staan zodra er een gezicht bedoeld is — ook als het
            // daarna misgaat. Anders is "geen balk" zowel "null-provider" als "kapot".
            if (m.avatar === 'anam') fase('sessie', 'bezig');
            // Pas starten als de server zegt dat de keten er is. De server vangt een te
            // vroege start ook af, maar twee keer voorzichtig kost hier niets.
            // Op de PROVIDER beslissen, niet op de aanwezigheid van een token. Anders is
            // "het token is mislukt" niet te onderscheiden van "er was geen gezicht
            // bedoeld", en draait de pagina zonder beeld verder terwijl de server iets
            // anders meldt. Dat kostte een avond zoeken in de frontend.
            if (m.avatar === 'anam' && !m.anamToken) {
              fase('sessie', null, m.avatarFout ?? 'geen sessietoken van de server');
              status('avatar aangevraagd maar niet opgezet — het gesprek is niet gestart');
              return;
            }
            if (m.anamToken) {
              status('avatar verbinden…');
              startAvatar(m.anamToken)
                .then(() => {
                  status('klaar — hij begint zo');
                  ws.send(JSON.stringify({ type: 'start' }));
                })
                .catch((e) => {
                  // Hard falen en niet doorgaan zonder gezicht: anders hoor je een gesprek,
                  // zie je niets, en lijkt het een frontendprobleem terwijl de avatar
                  // nooit is opgezet.
                  fase('sessie', null, 'mislukt: ' + e.message);
                  status('avatar mislukt — het gesprek is niet gestart: ' + e.message);
                });
            } else {
              // Ook zonder gezicht loopt er een sessie. De teller hoort de duur van het
              // gesprék te tonen, niet die van de avatar — anders staat hij op de
              // null-provider eeuwig op 00:00.
              startTeller();
              status('klaar — hij begint zo');
              ws.send(JSON.stringify({ type: 'start' }));
            }
          }
          if (m.type === 'endturn' && anam) {
            try {
              anamInvoer?.endSequence();
            } catch {}
            anamInvoer = null;
          }
          if (m.type === 'turn') {
            if (m.client) regel('u', m.client, '', 'client');
            regel('assistent', m.assistant, m.hud + (m.interrupted ? ' · onderbroken' : ''));
          }
          if (m.type === 'skipped') {
            regel('systeem', `beurt overgeslagen — ${m.reden}; hij blijft wachten`, '', 'waarschuwing');
          }
          if (m.type === 'cut') {
            const via = m.detectedBy === 'word_gap' ? 'woordgat' : 'UtteranceEnd.last_word_end';
            regel(
              'systeem',
              `uitspraak te vroeg afgekapt — gat ${m.gapMs} ms, gevangen door ${via}`,
              '',
              'waarschuwing',
            );
          }
          if (m.type === 'facts') {
            $('score').textContent = Math.round((m.completeness ?? 0) * 100) + '%';
            const tb = $('feiten').querySelector('tbody');
            tb.innerHTML = m.facts
              .map((f) => `<tr><td class="k">${f.key}</td><td>${f.value}</td></tr>`)
              .join('');
            $('risicos').innerHTML = m.risks.length
              ? m.risks
                  .map(
                    (r) =>
                      `<div class="risico ${r.level === 'CRITICAL' ? 'kritiek' : ''}">${r.level} — ${r.label}</div>`,
                  )
                  .join('')
              : 'geen signalen';
            if (m.extractionError) {
              regel('systeem', `feitextractie mislukt — ${m.extractionError}`, '', 'waarschuwing');
            }
            $('geweigerd').textContent = m.rejected.length
              ? m.rejected.map((r) => `${r.key}: ${r.reason}`).join(' · ')
              : 'geen';
          }
          if (m.type === 'error') {
            // Een fout blijft staan. Zonder dit overschrijft de statusregel van het
            // sluiten hem binnen een fractie van een seconde, en dan zie je alleen het
            // gevolg en nooit de oorzaak.
            fout(`fout (${m.waar}): ${m.wat}`);
          }
        };

        // Valt de server weg (ctrl-c), dan hoort deze kant ook op te ruimen: de server
        // sluit de avatarsessie zelf, maar anders staat hier nog een dood beeld te draaien.
        //
        // Eén handler, en niet twee. Er stonden er even twee — de tweede overschreef de
        // eerste stilzwijgend, en dan lijkt de opruiming te werken terwijl hij nooit
        // draait.
        ws.onclose = (e) => {
          console.log(`[live] socket dicht: code ${e.code} clean ${e.wasClean} reden "${e.reason}"`);
          stop('verbinding met de server weg');
        };

        // Microfoon → Int16 → server. ScriptProcessor omdat het één rekensom is en een
        // AudioWorklet daar een apart modulebestand voor vraagt.
        const bron = ctxIn.createMediaStreamSource(stream);
        const proc = ctxIn.createScriptProcessor(2048, 1, 1);
        const meter = $('niveau').firstElementChild;

        // Ruispoort: onder de drempel sturen we echte nullen.
        //
        // Deepgram's `endpointing` — en daarmee `speech_final` — werkt op VAD over de
        // audio: het moet stilte HOREN. Gemeten met pnpm diag:speechfinal sluit een beurt
        // bij digitale stilte na ~600 ms via speech_final, bij een rustige kamer
        // (-50 dBFS) pas na ~2000 ms, en bij ventilatorgeluid helemaal niet meer — dan
        // neemt het UtteranceEnd-vangnet het over op ~2400 ms. De ruisvloer van een
        // gewone microfoon bepaalt dus zowel het mechanisme als de latency.
        //
        // De drempel staat laag (~-46 dBFS) en er zit vertraging op het sluiten: pas na
        // een aaneengesloten periode onder de drempel gaat de poort dicht. Zachte spraak
        // afknippen zou dataverlies zijn, en dat is precies wat risico 2 verbiedt --
        // liever ruis doorlaten dan een woord verliezen.
        const POORT_DREMPEL = 0.005;
        const POORT_SLUIT_NA_MS = 120;
        let stilSinds = null;

        proc.onaudioprocess = (ev) => {
          const data = ev.inputBuffer.getChannelData(0);
          let piek = 0;
          let som = 0;
          for (let i = 0; i < data.length; i++) {
            const v = data[i];
            som += v * v;
            if (Math.abs(v) > piek) piek = Math.abs(v);
          }
          const rms = Math.sqrt(som / data.length);

          const nu = performance.now();
          if (rms > POORT_DREMPEL) stilSinds = null;
          else stilSinds ??= nu;
          const poortDicht = stilSinds !== null && nu - stilSinds >= POORT_SLUIT_NA_MS;

          const pcm = new Int16Array(data.length);
          if (!poortDicht) {
            for (let i = 0; i < data.length; i++) {
              pcm[i] = Math.max(-1, Math.min(1, data[i])) * 32767;
            }
          }

          meter.style.width = Math.min(100, piek * 180) + '%';
          meter.style.background = poortDicht ? '#2a3441' : '#3c8a63';
          if (ws && ws.readyState === 1) ws.send(pcm.buffer);
        };

        bron.connect(proc);
        // Naar de uitgang met gain 0: een ScriptProcessor draait alleen als hij in de
        // graaf naar de destination loopt, maar we willen onszelf niet terughoren.
        const stil = ctxIn.createGain();
        stil.gain.value = 0;
        proc.connect(stil);
        stil.connect(ctxIn.destination);
      }

      /** De SDK van een CDN, zoals hun quickstart. Geen bundler nodig voor een devpagina. */
      async function startAvatar(token) {
        const video = document.getElementById('avatar');
        fase('sessie', 'bezig');
        video.classList.add('aan');

        const { createClient } = await import('https://esm.sh/@anam-ai/js-sdk@4');
        anam = createClient(token);

        // Het frame-abonnement vóór het verbinden: anders mis je het eerste frame als de
        // verbinding sneller is dan de volgende regel.
        const eersteFrame = new Promise((res) => {
          if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(() => res());
          else video.addEventListener('playing', () => res(), { once: true });
        });

        await anam.streamToVideoElement('avatar');
        fase('sessie', 'klaar');
        fase('verbonden', 'klaar');

        // Expliciet play(). Het element heeft `autoplay`, maar met een audiotrack erbij
        // mag een browser dat weigeren zonder gebruikersgebaar. De klik op Start dekt dat
        // af; deze aanroep maakt zichtbaar wanneer hij dat tóch niet doet.
        try {
          await video.play();
        } catch (e) {
          fase('frame', null, 'browser weigert afspelen: ' + e.message);
          throw e;
        }

        await eersteFrame;
        fase('frame', 'klaar');

        // Het sessie-id naar de server, want die kan hem betrouwbaar afsluiten en deze
        // pagina niet: een tab die wordt weggeklikt krijgt geen kans meer om asynchroon
        // werk af te maken. Gemeten blijft zo'n sessie dan 10 tot 20 seconden doorlopen.
        const sessionId = anam.getActiveSessionId?.();
        if (sessionId) ws?.send(JSON.stringify({ type: 'anam', sessionId }));
        // Ook op window, zodat de controle in bakeoff/afsluiten-diagnose.ts precies de
        // sessie volgt die deze pagina draait in plaats van er een te raden uit de lijst.
        window.__anamSessionId = sessionId ?? null;
        startTeller();
      }

      /**
       * De zichtbare sessieteller.
       *
       * Avatarminuten zijn de duurste post in dit product en tot nu toe was er geen enkele
       * aanwijzing in beeld hoe lang er al betaald werd. Loopt vanaf het eerste frame,
       * want dat is het moment waarop de sessie aan hun kant echt draait.
       */
      let tellerVanaf = null;
      let tellerId = null;
      function startTeller() {
        tellerVanaf = performance.now();
        clearInterval(tellerId);
        tellerId = setInterval(() => {
          const s = Math.floor((performance.now() - tellerVanaf) / 1000);
          $('teller').textContent =
            `sessie ${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
        }, 1000);
      }
      function stopTeller() {
        clearInterval(tellerId);
        tellerId = null;
      }

      /**
       * Afsluiten, en het mag twee keer gebeuren.
       *
       * De server sluit ook af, en beide kunnen tegelijk gebeuren — bij ctrl-c komt er een
       * `stop`-bericht én valt de socket weg. Zonder deze wacht zou de tweede aanroep de
       * SDK opnieuw aanspreken en een fout in de console zetten die niets betekent.
       */
      let gestopt = false;
      function stop(reden = 'gestopt') {
        if (gestopt) return;
        gestopt = true;
        stopTeller();
        stopGeluid();
        if (anam) {
          // Ook al doet de server dit: twee keer sluiten kan geen kwaad en de browser is
          // sneller als hij nog leeft.
          anam.stopStreaming().catch(() => {});
          anam = null;
          document.getElementById('avatar').classList.remove('aan');
        }
        ws?.close();
        ctxIn?.close();
        ctxUit?.close();
        $('start').disabled = false;
        $('stop').disabled = true;
        status(reden);
      }

      $('start').onclick = () => {
        gestopt = false;
        start().catch((e) => status('fout: ' + e.message));
      };
      $('stop').onclick = () => stop('gestopt');

      /*
       * Wegklikken, verversen, of de browser sluiten.
       *
       * `pagehide` is de betrouwbare van de twee — `beforeunload` wordt op mobiel en bij
       * een teruggezette tab overgeslagen. Allebei registreren kost niets en `stop()` is
       * toch idempotent. Dit is een vangnet: de server is de eigenlijke afsluiter, want
       * asynchroon werk in deze handlers haalt de eindstreep niet altijd.
       */
      addEventListener('pagehide', () => stop('pagina weg'));
      addEventListener('beforeunload', () => stop('pagina weg'));
    </script>
  </body>
</html>
