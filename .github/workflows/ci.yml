name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: migratietest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # De architectuurgrens is een build-fout, geen afspraak. Breekt hij, dan werkt
      # de intake-intelligentie niet langer identiek in video en chat.
      - name: Architectuurgrenzen
        run: pnpm boundaries

      - name: Typecheck
        run: pnpm typecheck

      # Een import die niet in de package.json van het package zelf staat, resolvet op een
      # ontwikkelmachine via een node_modules boven de repo en op de buildmachine niet. Die
      # fout is per constructie onzichtbaar op de plek waar hij gemaakt wordt; hij hoort
      # hier te vallen en niet in een deploy.
      - name: Fantoomafhankelijkheden
        run: pnpm deps:check

      # De volledige migratiereeks tegen een LEGE database. Zonder deze stap vind je
      # volgordefouten pas in de volgende verse omgeving — meestal die van de klant.
      # Een `create function ... language sql` resolvet zijn referenties al bij CREATE,
      # dus een functie die een tabel noemt die later pas ontstaat, werkt wel op een
      # gemigreerde database en niet op een nieuwe.
      #
      # postgres:15 om de major version van Supabase te volgen (supabase/config.toml).
      - name: Migratievolgorde
        run: pnpm db:check
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/migratietest

      - name: Tests
        run: pnpm test

      # Geen ESLint-stap: er is nog geen flat config. Type-strictheid (tsc --strict +
      # noUncheckedIndexedAccess) en de architectuurgrenzen dekken nu het meeste af.
      # Zie docs/ROADMAP.md.
      - name: Formattering
        run: pnpm format:check

  # De tenant-isolatietests draaien tegen een echt Supabase-testproject. Zonder
  # secrets slaan ze zichzelf over — daarom staan ze in een aparte job, zodat het in
  # de UI zichtbaar is dat ze niet hebben gedraaid in plaats van te verdwijnen in
  # een groene suite.
  tenant-isolation:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tenant-isolatie
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_TEST_PUBLISHABLE_KEY }}
          SUPABASE_TEST_SECRET_KEY: ${{ secrets.SUPABASE_TEST_SECRET_KEY }}
        run: pnpm test:isolation
